name: Notion → Hugo → GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  schedule:
    - cron: '0 */1 * * *'  # 매시간 실행
  
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync mode (incremental or full-sync)'
        required: false
        default: 'incremental'
        type: choice
        options:
        - incremental
        - full-sync
  
  repository_dispatch:
    types: [trigger-hugo-build]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.128.0
  PYTHON_VERSION: "3.10"
  STATE_FILE: .notion-hugo-state.json
  FLAT_COUNT_FILE: .notion-hugo-flat-count # BLOG-010: 직전 성공 때 Notion 평평한 글 수(캐시에 실림)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "notion-client>=2.0.0,<2.5.0" python-dotenv pyyaml fs tabulate

      - name: Restore Notion sync state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_FILE }}
            ${{ env.FLAT_COUNT_FILE }}
            content/posts/
          key: notion-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            notion-state-${{ github.ref_name }}-
            notion-state-

      # BL-003: 캐시가 content/posts/ 를 통째로 풀어 손글 묶음(content/posts/<slug>/)을 옛 판으로 덮을 수 있다.
      # 추적 파일은 이번 커밋 판으로 다시 깔고, 저장소에서 지운 묶음은 지운다(Notion 평평한 글은 그대로).
      - name: Restore hand-written posts from git
        run: scripts/restore_hand_posts.sh

      - name: Determine sync mode
        id: sync-mode
        run: |
          # 동기화 모드 결정 로직 개선
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ -z "$COMMIT_MSG" ]]; then
            COMMIT_MSG="$(git log -1 --pretty=%B)"
          fi
          REF_NAME="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"
          MANUAL_INPUT="${{ github.event.inputs.sync_mode }}"
          
          echo "Debug info:"
          echo "- Commit message: '$COMMIT_MSG'"
          echo "- Ref name: '$REF_NAME'"
          echo "- Event name: '$EVENT_NAME'"
          echo "- Manual input: '$MANUAL_INPUT'"
          
          # 우선순위별 모드 결정
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_INPUT" ]]; then
            # 1순위: 수동 실행 시 사용자가 직접 선택한 모드
            SYNC_MODE="$MANUAL_INPUT"
            echo "📝 User selected mode: $SYNC_MODE"
          elif [[ "$COMMIT_MSG" == *"[full-sync]"* ]] || \
               [[ "$COMMIT_MSG" == *"[force-rebuild]"* ]]; then
            # 2순위: 커밋 메시지의 키워드
            SYNC_MODE="full-sync"
            echo "🏷️ Keyword-triggered full sync"
          elif [[ "$REF_NAME" == *"full-sync"* ]]; then
            # 3순위: 브랜치명에 full-sync 포함
            SYNC_MODE="full-sync"
            echo "🌿 Branch-triggered full sync"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            # 4순위: 스케줄 실행은 full-sync (정기 동기화)
            SYNC_MODE="full-sync"
            echo "⏰ Scheduled full sync"
          else
            # 기본: incremental 모드
            SYNC_MODE="incremental"
            echo "⚡ Default incremental sync"
          fi
          
          echo "mode=$SYNC_MODE" >> $GITHUB_OUTPUT
          
          if [[ "$SYNC_MODE" == "full-sync" ]]; then
            echo "🔄 Full sync mode activated"
          else
            echo "⚡ Incremental sync mode activated"
          fi
          
          echo "Final sync mode: $SYNC_MODE"

      - name: Debug Secrets
        run: |
          if [ -n "${{ secrets.NOTION_TOKEN }}" ]; then
            echo "✅ NOTION_TOKEN secret is loaded."
          else
            echo "❌ NOTION_TOKEN secret is NOT loaded or is empty."
          fi
          if [ -n "${{ secrets.NOTION_DATABASE_ID_POSTS }}" ]; then
            echo "✅ NOTION_DATABASE_ID_POSTS secret is loaded."
          else
            echo "❌ NOTION_DATABASE_ID_POSTS secret is NOT loaded or is empty."
          fi

      - name: Generate Markdown from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID_POSTS: ${{ secrets.NOTION_DATABASE_ID_POSTS }}
        run: |
          SYNC_MODE="${{ steps.sync-mode.outputs.mode }}"
          echo "Running with sync mode: $SYNC_MODE"
          
          # Run Notion sync and capture exit code
          set -e  # Exit on error
          if [[ "$SYNC_MODE" == "full-sync" ]]; then
            echo "🔄 Executing full synchronization..."
            python notion_hugo_app.py --full-sync --state-file $STATE_FILE
          else
            echo "⚡ Executing incremental synchronization..."
            python notion_hugo_app.py --incremental --state-file $STATE_FILE
          fi
          
          # Verify content was generated (BLOG-010: Notion 평평한 글 수로 — 손글 묶음은 세지 않음)
          scripts/check_flat_posts.sh content/posts "$FLAT_COUNT_FILE" 50
          
          echo "✅ Content generation successful"

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          # Pages reports http://gunn.kim while "Enforce HTTPS" is off; an http baseURL makes the theme's
          # absolute srcset/og:image http, which https pages block as mixed content (covers broke 2026-11-09).
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          BASE_URL="${BASE_URL/#http:\/\//https://}"
          hugo --minify --baseURL "${BASE_URL}/"
          
          # Validate Hugo build output
          if [ ! -d "public" ] || [ -z "$(ls -A public)" ]; then
            echo "❌ Hugo build failed - public directory is empty"
            exit 1
          fi
          
          if [ ! -f "public/index.html" ]; then
            echo "❌ Hugo build failed - no index.html generated"
            exit 1
          fi
          
          # Check if index.html has reasonable content
          INDEX_SIZE=$(wc -c < "public/index.html")
          if [ "$INDEX_SIZE" -lt 100 ]; then
            echo "❌ Hugo build failed - index.html too small ($INDEX_SIZE bytes)"
            exit 1
          fi
          
          echo "✅ Hugo build validation successful"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # BL-003: 배포 뒤 손글(draft: false) → Notion 블로그 DB 거울(Slug upsert, Source = hugo).
  # 스위치 = 저장소 변수 NOTION_MIRROR (on 일 때만). 켜기 전에 DB에 Source 칸과 키 쓰기 권한이 있어야 한다.
  # 거울이 실패해도 사이트 배포에는 영향 없음.
  mirror:
    if: vars.NOTION_MIRROR == 'on' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install "notion-client>=2.0.0,<2.5.0" pyyaml

      - name: Mirror hand-written posts to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID_POSTS: ${{ secrets.NOTION_DATABASE_ID_POSTS }}
        run: python scripts/mirror_to_notion.py
