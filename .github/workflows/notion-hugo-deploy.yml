name: Hugo → GitHub Pages (repo is the source)

# BLOG-017 (BRIEF-BL-005 §4): the old hourly Notion → Hugo import and its content/posts cache are retired.
# Every post is a repo bundle (content/posts/<slug>/). Notion edits come back as commits through
# repo-ssot-sync.yml, which then starts this workflow (workflow_dispatch). Repo → Notion is repo-ssot-sync.yml too
# (the old `mirror` job is gone: two writers to one Notion page would fight over the body).
#
# Fires on main only. On any other branch a manual run builds and checks but never deploys (deploy: if main).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.128.0
  PYTHON_VERSION: "3.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # BLOG-017 F1: replaces check_flat_posts.sh (flat Notion file count as success). Two published pages at one
      # URL (a leftover flat copy, two bundles with one slug) stop the build here.
      - name: Every URL once
        run: python scripts/check_duplicate_urls.py

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          # Pages reports http://gunn.kim while "Enforce HTTPS" is off; an http baseURL makes the theme's
          # absolute srcset/og:image http, which https pages block as mixed content (covers broke 2026-11-09).
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          BASE_URL="${BASE_URL/#http:\/\//https://}"
          hugo --minify --baseURL "${BASE_URL}/"

          if [ ! -f "public/index.html" ] || [ "$(wc -c < public/index.html)" -lt 100 ]; then
            echo "❌ Hugo build failed - no usable public/index.html"
            exit 1
          fi
          echo "✅ Hugo build validation successful"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # BLOG-017 F6 (dinesh, ci/site-check-job.yml): open the live site in a browser after the deploy.
  # Fails on: broken <img> (naturalWidth 0), any http:// href/src, internal link 4xx/5xx, icon not 200.
  site-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund   # no lockfile yet; pins playwright via package.json
      - run: npx playwright install --with-deps chromium
      - name: Check the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url || 'https://gunn.kim' }}
        run: node scripts/site_check.mjs --base "$SITE_URL" --sample 20 --recent 5 --out site-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check
          path: site-check.json
