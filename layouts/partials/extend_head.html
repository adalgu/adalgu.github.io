{{ partial "redirect.html" . }}

{{- /* slot r10-P06: 분석·광고 스크립트는 운영 빌드에서만(hugo.IsProduction) — 개발 서버·미리보기는 GA 수치·광고 요청을 더럽히지 않게.
     운영 빌드 = CI(HUGO_ENVIRONMENT=production)·Dockerfile·그냥 `hugo`. slot r12-P05: 두 도메인 preconnect 힌트를 스크립트 앞에. */}}
{{- if hugo.IsProduction }}
<link rel="preconnect" href="https://www.googletagmanager.com" />
<link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
<!-- Google tag (gtag.js) — TASK-549: not on local hosts (127.0.0.1/localhost previews of a production build polluted GA) -->
<script>
  (function (id) {
    if (/^(localhost|127(\.\d+){3}|0\.0\.0\.0|\[::1\])$/.test(location.hostname)) return;
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", id);
  })("G-BQ6CZ7HMQK");
</script>
<script
  async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3695098602071408"
  crossorigin="anonymous"
></script>
{{- end }}
